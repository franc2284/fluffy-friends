<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Питомец — Роки</title>
  <link rel="stylesheet" href="pet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">

    <div class="dog_img">
      <img class="dog_img__photo" src="../images/Rectangle 79.svg" alt="Лабрадор">
      <img class="icon icon--back" src="../images/heroicons_arrow-up-16-solid.svg" alt="Назад">
      <img class="icon icon--fav" src="../images/Frame 342.svg" alt="Избранное">
    </div>

    <div class="card-content">
      <div class="title-row">
        <p class="name">Роки</p>
        <img class="gender" src="../images/ic_round-male.svg" alt="Самец">
      </div>
      
      <div class="meta-row">
        <p class="breed">Лабрадор-Ретривер</p>
        <div class="distance">
          <img class="distance__icon" src="../images/bxs_map.svg">
          <p class="distance__text">2,5 км</p>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-title">Возраст</div>
          <div class="stat-value">6 лет</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Рост</div>
          <div class="stat-value">90 см</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Вес</div>
          <div class="stat-value">8 кг</div>
        </div>
      </div>

      <div class="bloc">
        <p class="description">
          Роки — нежный и любящий лабрадор-<br>ретривер, который с
          нетерпением ждет<br> своего любящего хозяина... <span>УЗНАТЬ БОЛЬШЕ</span>
        </p>
      </div>

      <div class="knopka1">
        <p class="k1">Угостить</p>
        <img src="../images/f7_money-dollar-circle-fill.svg">
      </div>

      <div class="knopka2">
        <p class="k2">Приютить</p>
        <img src="../images/ph_paw-print-fill.svg">
      </div>

    </div>
  </div>
  
</body>
</html>
