<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Питомец — Роки</title>
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <div class="container">

    <div class="dog_img">
      <img class="dog_img__photo" src="../images/Rectangle 79.svg" alt="Лабрадор">
      <img class="icon icon--back" src="../images/heroicons_arrow-up-16-solid.svg" alt="Назад">
      <img class="icon icon--fav" src="../images/Frame 342.svg" alt="Избранное">
    </div>

    <div class="card-content">
      <div class="title-row">
        <p class="name">Роки</p>
        <img class="gender" src="../images/ic_round-male.svg" alt="Самец">
      </div>
      
      <div class="meta-row">
        <p class="breed">Лабрадор-Ретривер</p>
        <div class="distance">
          <img class="distance__icon" src="../images/bxs_map.svg">
          <p class="distance__text">2,5 км</p>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-title">Возраст</div>
          <div class="stat-value">6 лет</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Рост</div>
          <div class="stat-value">90 см</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Вес</div>
          <div class="stat-value">8 кг</div>
        </div>
      </div>
    </div>
  </div>
  
</body>
</html>
