<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Пушистые друзья!</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img class="logo" src="images/fa6-solid_shield-dog.svg">
      <h1 class="title">Пушистые друзья</h1>
    </div>
    <div class="search">
        <img class="search_icon" src="images/Group.svg">
        <input type="text" placeholder="Искать пушистика">
    </div>

    <div class="block_1">
      <div class="thumb">
        <img src="images/Rectangle 75.svg">
      </div>

      <div class="pet-info">

        <div class="iconka">
          <p class="name">Лола</p>
          <img src="images/ion_female.svg">
        </div>

        <div class="iconka_2">
          <p class="name_2">Джек Рассел Терьер</p>
        </div>

        <div class="distance">
            <img class="distance__icon" src="images/bxs_map.svg">
            <p class="distance__text">10 км</p>
        </div>

        <div class="heart">
          <img class="heart_2" src="images/ph_heart-bold.svg">
        </div>

      </div>

    </div>
  </div>
</body>
</html>
